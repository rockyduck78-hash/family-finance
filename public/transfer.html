<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transfer - Family Finance</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div class="app-layout">
        <nav class="topnav">
            <a href="/dashboard" class="topnav-brand">
                <div class="brand-icon">$</div>
                <span class="brand-text">Family Finance</span>
            </a>
            <div class="topnav-nav">
                <a href="/dashboard"><span class="nav-icon">&#9632;</span> <span class="nav-label">Dashboard</span></a>
                <a href="/transactions"><span class="nav-icon">&#9655;</span> <span class="nav-label">Transactions</span></a>
                <a href="/kids"><span class="nav-icon">&#9679;</span> <span class="nav-label">Kids</span></a>
                <a href="/transfer" class="active"><span class="nav-icon">&#8644;</span> <span class="nav-label">Transfer</span></a>
            </div>
            <div class="topnav-right">
                <div class="topnav-user" id="user-menu">
                    <button class="user-menu-btn" onclick="toggleUserMenu()">
                        <div class="topnav-avatar" id="user-avatar"></div>
                        <span class="topnav-username" id="user-display"></span>
                        <span class="menu-arrow">&#9662;</span>
                    </button>
                    <div class="user-dropdown">
                        <button onclick="showChangePassword()">&#128274; Change Password</button>
                        <button onclick="showChangeUsername()">&#9998; Change Username</button>
                        <div class="divider"></div>
                        <div style="padding:8px 16px 4px;font-size:12px;font-weight:600;color:var(--gray-400);text-transform:uppercase;letter-spacing:0.05em;">Theme</div>
                        <div class="theme-options">
                            <button class="theme-btn" data-theme="light" onclick="setTheme('light')"></button>
                            <button class="theme-btn" data-theme="dark" onclick="setTheme('dark')"></button>
                            <button class="theme-btn" data-theme="blue" onclick="setTheme('blue')"></button>
                        </div>
                        <div class="divider"></div>
                        <button class="danger" onclick="logout()">&#10140; Sign Out</button>
                    </div>
                </div>
            </div>
        </nav>

        <main class="main-content">
            <div class="page-header">
                <h1>Transfer</h1>
                <p>Send money to another family member</p>
            </div>

            <div class="card">
                <div class="card-header">
                    <span class="card-title">Send Money</span>
                </div>
                <form id="transfer-form">
                    <div class="form-group">
                        <label>Recipient Username</label>
                        <input type="text" id="transfer-to" placeholder="Enter username" required>
                    </div>
                    <div class="form-group">
                        <label>Type</label>
                        <select id="transfer-type" onchange="onTransferTypeChange()">
                            <option value="custom">Custom Amount</option>
                            <option value="firstmate">First Mate ($22)</option>
                            <option value="videogames">Video Games</option>
                            <option value="gym">Gym</option>
                            <option value="dogwalk">Dog Walk</option>
                        </select>
                    </div>

                    <div id="preset-options" style="display:none;">
                        <div id="opt-videogames" class="preset-panel" style="display:none;">
                            <div class="form-group">
                                <label>Hours Played</label>
                                <div class="counter-row">
                                    <button type="button" class="btn-counter" onclick="adjustHours(-1)">-</button>
                                    <span class="counter-value" id="hours-display">1</span>
                                    <button type="button" class="btn-counter" onclick="adjustHours(1)">+</button>
                                </div>
                            </div>
                            <div class="preset-breakdown" id="hours-breakdown"></div>
                        </div>
                        <div id="opt-gym" class="preset-panel" style="display:none;">
                            <div class="form-group">
                                <label>Machines Used</label>
                                <div class="counter-row">
                                    <button type="button" class="btn-counter" onclick="adjustMachines(-1)">-</button>
                                    <span class="counter-value" id="machines-display">1</span>
                                    <button type="button" class="btn-counter" onclick="adjustMachines(1)">+</button>
                                </div>
                            </div>
                            <div class="preset-breakdown" id="machines-breakdown"></div>
                        </div>
                        <div id="opt-dogwalk" class="preset-panel" style="display:none;">
                            <div class="form-group">
                                <label>Number of Walks</label>
                                <div class="counter-row">
                                    <button type="button" class="btn-counter" onclick="adjustWalks(-1)">-</button>
                                    <span class="counter-value" id="walks-display">1</span>
                                    <button type="button" class="btn-counter" onclick="adjustWalks(1)">+</button>
                                </div>
                            </div>
                            <div class="preset-breakdown" id="walks-breakdown"></div>
                        </div>
                        <div id="opt-firstmate" class="preset-panel" style="display:none;">
                            <div class="preset-flat">Flat rate: <strong>$22.00</strong></div>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Amount ($)</label>
                            <input type="number" id="transfer-amount" step="0.01" min="0.01" placeholder="0.00" required>
                        </div>
                        <div class="form-group">
                            <label>Note (optional)</label>
                            <input type="text" id="transfer-note" placeholder="e.g., For groceries">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Send Money</button>
                </form>
            </div>

            <div class="card">
                <div class="card-header">
                    <span class="card-title">Transfer History</span>
                </div>
                <div class="transaction-list" id="transfer-list">
                    <div class="empty-state"><span class="icon">&#8644;</span><p>No transfers yet</p></div>
                </div>
            </div>
        </main>
    </div>

    <script src="/user-menu.js"></script>
    <script>
        const user = localStorage.getItem('currentUser');
        if (!user) window.location.href = '/';
        initUserMenu(user);

        let transactions = [];
        let videoGameHours = 1;
        let gymMachines = 1;
        let dogWalks = 1;

        async function loadData() {
            const res = await fetch('/api/user/' + user);
            const data = await res.json();
            transactions = data.transactions || [];
            renderTransfers();
        }

        function fmt(n) {
            return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(n);
        }

        function calcVideoGameAmount(hours) {
            if (hours <= 0) return 0;
            if (hours === 1) return 4;
            return 4 + (hours - 1) * 16;
        }

        function onTransferTypeChange() {
            const type = document.getElementById('transfer-type').value;
            const presetOptions = document.getElementById('preset-options');
            const amountInput = document.getElementById('transfer-amount');
            const noteInput = document.getElementById('transfer-note');

            document.querySelectorAll('.preset-panel').forEach(p => p.style.display = 'none');

            if (type === 'custom') {
                presetOptions.style.display = 'none';
                amountInput.readOnly = false;
                amountInput.value = '';
                noteInput.value = '';
                return;
            }

            presetOptions.style.display = 'block';
            amountInput.readOnly = true;

            if (type === 'firstmate') {
                document.getElementById('opt-firstmate').style.display = 'block';
                amountInput.value = '22.00';
                noteInput.value = 'First Mate';
            } else if (type === 'videogames') {
                document.getElementById('opt-videogames').style.display = 'block';
                updateVideoGameDisplay();
            } else if (type === 'gym') {
                document.getElementById('opt-gym').style.display = 'block';
                updateGymDisplay();
            } else if (type === 'dogwalk') {
                document.getElementById('opt-dogwalk').style.display = 'block';
                updateDogWalkDisplay();
            }
        }

        function updateVideoGameDisplay() {
            document.getElementById('hours-display').textContent = videoGameHours;
            const amount = calcVideoGameAmount(videoGameHours);
            document.getElementById('transfer-amount').value = amount.toFixed(2);
            let breakdown = '';
            if (videoGameHours === 1) {
                breakdown = '1st hour: $4.00';
            } else {
                breakdown = '1st hour: $4.00 + ' + (videoGameHours - 1) + ' extra hr' + (videoGameHours - 1 > 1 ? 's' : '') + ': $' + ((videoGameHours - 1) * 16).toFixed(2);
            }
            document.getElementById('hours-breakdown').textContent = breakdown;
            document.getElementById('transfer-note').value = 'Video Games - ' + videoGameHours + ' hr' + (videoGameHours > 1 ? 's' : '');
        }

        function adjustHours(delta) {
            videoGameHours = Math.max(1, videoGameHours + delta);
            updateVideoGameDisplay();
        }

        function updateGymDisplay() {
            document.getElementById('machines-display').textContent = gymMachines;
            const amount = gymMachines * 4;
            document.getElementById('transfer-amount').value = amount.toFixed(2);
            document.getElementById('machines-breakdown').textContent = gymMachines + ' machine' + (gymMachines > 1 ? 's' : '') + ' x $4.00 = $' + amount.toFixed(2);
            document.getElementById('transfer-note').value = 'Gym - ' + gymMachines + ' machine' + (gymMachines > 1 ? 's' : '');
        }

        function adjustMachines(delta) {
            gymMachines = Math.max(1, gymMachines + delta);
            updateGymDisplay();
        }

        function updateDogWalkDisplay() {
            document.getElementById('walks-display').textContent = dogWalks;
            const amount = dogWalks * 3;
            document.getElementById('transfer-amount').value = amount.toFixed(2);
            document.getElementById('walks-breakdown').textContent = dogWalks + ' walk' + (dogWalks > 1 ? 's' : '') + ' x $3.00 = $' + amount.toFixed(2);
            document.getElementById('transfer-note').value = 'Dog Walk - ' + dogWalks + ' walk' + (dogWalks > 1 ? 's' : '');
        }

        function adjustWalks(delta) {
            dogWalks = Math.max(1, dogWalks + delta);
            updateDogWalkDisplay();
        }

        function renderTransfers() {
            const list = document.getElementById('transfer-list');
            const txs = transactions.filter(t => t.category === 'transfer');
            if (!txs.length) {
                list.innerHTML = '<div class="empty-state"><span class="icon">&#8644;</span><p>No transfers yet</p></div>';
                return;
            }
            list.innerHTML = txs.sort((a, b) => new Date(b.date) - new Date(a.date)).map(t => `
                <div class="transaction-item">
                    <div class="transaction-left">
                        <div class="transaction-icon">${t.type === 'income' ? '&#8593;' : '&#8595;'}</div>
                        <div class="transaction-info">
                            <h4>${t.description}</h4>
                            <span>${new Date(t.date).toLocaleDateString()}</span>
                        </div>
                    </div>
                    <span class="transaction-amount ${t.type}">${t.type === 'income' ? '+' : '-'}${fmt(t.amount)}</span>
                </div>
            `).join('');
        }

        document.getElementById('transfer-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const to = document.getElementById('transfer-to').value.trim();
            const amount = parseFloat(document.getElementById('transfer-amount').value);
            const note = document.getElementById('transfer-note').value.trim();
            if (to === user) return alert("Can't send to yourself");
            const res = await fetch('/api/transfer', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ from: user, to, amount, note })
            });
            const data = await res.json();
            if (data.error) return alert(data.error);
            alert('Sent $' + amount.toFixed(2) + ' to ' + to);
            e.target.reset();
            document.getElementById('transfer-type').value = 'custom';
            document.getElementById('preset-options').style.display = 'none';
            document.getElementById('transfer-amount').readOnly = false;
            videoGameHours = 1;
            gymMachines = 1;
            dogWalks = 1;
            loadData();
        });

        loadData();
    </script>

    <!-- Change Password Modal -->
    <div class="modal-overlay" id="change-pw-modal">
        <div class="modal">
            <h3>Change Password</h3>
            <div class="form-group"><label>Current Password</label><input type="password" id="pw-current" placeholder="Current password"></div>
            <div class="form-group"><label>New Password</label><input type="password" id="pw-new" placeholder="New password"></div>
            <div class="form-group"><label>Confirm New Password</label><input type="password" id="pw-confirm" placeholder="Confirm new password"></div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeChangePwModal()">Cancel</button>
                <button class="btn btn-primary" onclick="submitChangePw()">Save</button>
            </div>
        </div>
    </div>

    <!-- Change Username Modal -->
    <div class="modal-overlay" id="change-un-modal">
        <div class="modal">
            <h3>Change Username</h3>
            <div class="form-group"><label>New Username</label><input type="text" id="un-new" placeholder="New username"></div>
            <div class="form-group"><label>Password (to confirm)</label><input type="password" id="un-password" placeholder="Enter password"></div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeChangeUnModal()">Cancel</button>
                <button class="btn btn-primary" onclick="submitChangeUn()">Save</button>
            </div>
        </div>
    </div>
</body>
</html>
