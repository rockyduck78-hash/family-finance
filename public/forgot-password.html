<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>Recover Account - Family Finance</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/auth.js"></script>
    <script src="/notifications.js"></script>
</head>
<body>
    <div class="landing-page">
        <div class="money-symbols">
            <span class="money-symbol">$</span><span class="money-symbol">$</span><span class="money-symbol">$</span>
            <span class="money-symbol">$</span><span class="money-symbol">$</span><span class="money-symbol">$</span>
            <span class="money-symbol">$</span><span class="money-symbol">$</span><span class="money-symbol">$</span>
            <span class="money-symbol">$</span>
        </div>
        <nav class="landing-nav">
            <a href="/" class="logo">
                <div class="logo-icon">$</div>
                <span class="logo-text">Family Finance</span>
            </a>
        </nav>

        <section class="hero">
            <div class="hero-content" style="justify-content:center;">
                <div class="auth-card" style="max-width:460px;">
                    <div class="auth-card-header">
                        <h2>Recover Account</h2>
                        <p>Reset your password or find your username</p>
                    </div>

                    <div class="auth-tabs">
                        <button class="auth-tab active" onclick="showTab('password')">Reset Password</button>
                        <button class="auth-tab" onclick="showTab('username')">Find Username</button>
                    </div>

                    <!-- Reset Password: Step 1 - Enter email -->
                    <div class="auth-form active" id="step-email">
                        <form id="email-form">
                            <div class="form-group">
                                <label>Email on file</label>
                                <input type="email" id="recovery-email" placeholder="your@email.com" required>
                            </div>
                            <button type="submit" class="btn-primary">Send Reset Code</button>
                        </form>
                        <div class="auth-footer"><a href="/">Back to sign in</a></div>
                    </div>

                    <!-- Reset Password: Step 2 - Enter code -->
                    <div class="auth-form" id="step-code">
                        <p id="code-msg" style="font-size:13px;color:rgba(255,255,255,0.6);margin-bottom:16px;"></p>
                        <form id="code-form">
                            <div class="form-group">
                                <label>6-digit code</label>
                                <input type="text" id="reset-code" placeholder="000000" maxlength="6" required style="letter-spacing:6px;text-align:center;font-size:20px;">
                            </div>
                            <button type="submit" class="btn-primary">Verify Code</button>
                        </form>
                        <div class="auth-footer"><a onclick="showTab('email')">Use a different email</a></div>
                    </div>

                    <!-- Reset Password: Step 3 - New password -->
                    <div class="auth-form" id="step-newpw">
                        <form id="newpw-form">
                            <div class="form-group">
                                <label>New Password</label>
                                <input type="password" id="new-password" placeholder="New password" required>
                            </div>
                            <div class="form-group">
                                <label>Confirm Password</label>
                                <input type="password" id="confirm-password" placeholder="Confirm password" required>
                            </div>
                            <button type="submit" class="btn-primary">Reset Password</button>
                        </form>
                    </div>

                    <!-- Find Username -->
                    <div class="auth-form" id="tab-username">
                        <form id="username-form">
                            <div class="form-group">
                                <label>Email on file</label>
                                <input type="email" id="lookup-email" placeholder="your@email.com" required>
                            </div>
                            <button type="submit" class="btn-primary">Find My Username</button>
                        </form>
                        <div class="auth-footer"><a href="/">Back to sign in</a></div>
                    </div>

                    <!-- Success -->
                    <div class="auth-form" id="step-success">
                        <div style="text-align:center;padding:20px 0;">
                            <div style="font-size:48px;margin-bottom:16px;">&#10003;</div>
                            <h3 style="color:#fff;margin-bottom:8px;">Password Reset!</h3>
                            <p style="color:rgba(255,255,255,0.6);font-size:14px;margin-bottom:24px;">Your password has been updated.</p>
                            <a href="/" class="btn-primary" style="display:inline-block;padding:12px 32px;text-decoration:none;border-radius:8px;">Sign In</a>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <footer class="landing-footer">
            <p>&copy; 2026 Family Finance. Secure family financial management.</p>
        </footer>
    </div>

    <script>
        let resetEmail = '';
        let resetCode = '';

        function showTab(tab) {
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
            if (tab === 'password') {
                document.querySelectorAll('.auth-tab')[0].classList.add('active');
                document.getElementById('step-email').classList.add('active');
            } else if (tab === 'email') {
                document.querySelectorAll('.auth-tab')[0].classList.add('active');
                document.getElementById('step-email').classList.add('active');
            } else {
                document.querySelectorAll('.auth-tab')[1].classList.add('active');
                document.getElementById('tab-username').classList.add('active');
            }
        }

        function showStep(id) {
            document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        // Step 1: Request reset code
        document.getElementById('email-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            resetEmail = document.getElementById('recovery-email').value.trim();
            const res = await fetch('/api/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: resetEmail })
            });
            const data = await res.json();
            if (data.error) return notifyError(data.error);
            if (data.emailed) {
                document.getElementById('code-msg').textContent = 'A reset code has been sent to your email.';
            } else {
                document.getElementById('code-msg').textContent = data.code
                    ? 'Email not configured. Your reset code is: ' + data.code
                    : 'Enter the reset code for your account.';
            }
            showStep('step-code');
        });

        // Step 2: Verify code
        document.getElementById('code-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            resetCode = document.getElementById('reset-code').value.trim();
            const res = await fetch('/api/verify-reset-code', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: resetEmail, code: resetCode })
            });
            const data = await res.json();
            if (data.error) return notifyError(data.error);
            showStep('step-newpw');
        });

        // Step 3: Set new password
        document.getElementById('newpw-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPw = document.getElementById('new-password').value;
            const confirmPw = document.getElementById('confirm-password').value;
            if (newPw !== confirmPw) return notifyError('Passwords do not match');
            const res = await fetch('/api/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: resetEmail, code: resetCode, newPassword: newPw })
            });
            const data = await res.json();
            if (data.error) return notifyError(data.error);
            showStep('step-success');
        });

        // Find Username
        document.getElementById('username-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('lookup-email').value.trim();
            const res = await fetch('/api/forgot-username', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });
            const data = await res.json();
            if (data.error) return notifyError(data.error);
            notifySuccess('Your username is: ' + data.username);
        });
    </script>
</body>
</html>
