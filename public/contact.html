<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>Contact Us - Family Finance</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div class="landing-page">
        <nav class="landing-nav">
            <a href="/" class="logo">
                <div class="logo-icon">$</div>
                <span class="logo-text">Family Finance</span>
            </a>
            <div class="landing-nav-links">
                <a href="/">Home</a>
                <a href="/privacy">Privacy</a>
                <a href="/terms">Terms</a>
            </div>
        </nav>
        <section style="max-width: 800px; margin: 100px auto; padding: 40px; background: rgba(255,255,255,0.05); border-radius: var(--radius-lg); position: relative; z-index: 1;">
            <h1 style="color: var(--white); margin-bottom: 24px;">Contact Us</h1>
            <p style="color: var(--gray-300); margin-bottom: 24px; line-height: 1.8;">Have questions? We're here to help.</p>
            <div style="background: rgba(255,255,255,0.08); padding: 24px; border-radius: var(--radius); margin-bottom: 24px;">
                <h3 style="color: var(--white); margin-bottom: 12px;">Email Support</h3>
                <a href="mailto:support@familyfinance.app" style="color: var(--blue-400);">support@familyfinance.app</a>
            </div>
            <div style="background: rgba(255,255,255,0.08); padding: 24px; border-radius: var(--radius); margin-bottom: 24px;">
                <h3 style="color: var(--white); margin-bottom: 12px;">Security Issues</h3>
                <a href="mailto:security@familyfinance.app" style="color: var(--blue-400);">security@familyfinance.app</a>
            </div>
        </section>
        <footer class="landing-footer">
            <p>&copy; 2026 Family Finance. Secure family financial management.</p>
            <p><a href="/privacy">Privacy Policy</a> | <a href="/terms">Terms of Service</a> | <a href="/contact">Contact</a></p>
        </footer>
    </div>
</body>
</html>
