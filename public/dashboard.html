<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Family Finance</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="app-layout">
        <nav class="topnav">
            <a href="/dashboard" class="topnav-brand">
                <div class="brand-icon">$</div>
                <span class="brand-text">Family Finance</span>
            </a>
            <div class="topnav-nav">
                <a href="/dashboard" class="active"><span class="nav-icon">&#9632;</span> <span class="nav-label">Dashboard</span></a>
                <a href="/transactions"><span class="nav-icon">&#9655;</span> <span class="nav-label">Transactions</span></a>
                <a href="/kids"><span class="nav-icon">&#9679;</span> <span class="nav-label">Kids</span></a>
                <a href="/transfer"><span class="nav-icon">&#8644;</span> <span class="nav-label">Transfer</span></a>
            </div>
            <div class="topnav-right">
                <div class="topnav-user" id="user-menu">
                    <button class="user-menu-btn" onclick="toggleUserMenu()">
                        <div class="topnav-avatar" id="user-avatar"></div>
                        <span class="topnav-username" id="user-display"></span>
                        <span class="menu-arrow">&#9662;</span>
                    </button>
                    <div class="user-dropdown">
                        <button onclick="showChangePassword()">&#128274; Change Password</button>
                        <button onclick="showChangeUsername()">&#9998; Change Username</button>
                        <div class="divider"></div>
                        <div style="padding:8px 16px 4px;font-size:12px;font-weight:600;color:var(--gray-400);text-transform:uppercase;letter-spacing:0.05em;">Theme</div>
                        <div class="theme-options">
                            <button class="theme-btn" data-theme="light" onclick="setTheme('light')"></button>
                            <button class="theme-btn" data-theme="dark" onclick="setTheme('dark')"></button>
                            <button class="theme-btn" data-theme="blue" onclick="setTheme('blue')"></button>
                        </div>
                        <div class="divider"></div>
                        <button class="danger" onclick="logout()">&#10140; Sign Out</button>
                    </div>
                </div>
            </div>
        </nav>

        <main class="main-content">
            <div class="page-header">
                <h1>Dashboard</h1>
                <p>Your financial overview at a glance</p>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Total Income</div>
                    <div class="stat-value income" id="total-income">$0.00</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Total Expenses</div>
                    <div class="stat-value expense" id="total-expenses">$0.00</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Current Balance</div>
                    <div class="stat-value balance" id="current-balance">$0.00</div>
                </div>
            </div>

            <div class="charts-grid">
                <div class="chart-card">
                    <h3>Income vs Expenses</h3>
                    <div class="chart-container"><canvas id="incomeExpenseChart"></canvas></div>
                </div>
                <div class="chart-card">
                    <h3>Spending by Category</h3>
                    <div class="chart-container"><canvas id="categoryChart"></canvas></div>
                </div>
            </div>
        </main>
    </div>

    <script src="/user-menu.js"></script>
    <script>
        const user = localStorage.getItem('currentUser');
        if (!user) window.location.href = '/';
        initUserMenu(user);

        let transactions = [];
        let incomeExpenseChart = null;
        let categoryChart = null;

        async function loadData() {
            const res = await fetch('/api/user/' + user);
            const data = await res.json();
            transactions = data.transactions || [];
            updateSummary();
            updateCharts();
        }

        function formatCurrency(amount) {
            return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(amount);
        }

        function updateSummary() {
            const income = transactions.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
            const expenses = transactions.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
            document.getElementById('total-income').textContent = formatCurrency(income);
            document.getElementById('total-expenses').textContent = formatCurrency(expenses);
            document.getElementById('current-balance').textContent = formatCurrency(income - expenses);
        }

        function updateCharts() {
            const income = transactions.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
            const expenses = transactions.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);

            if (incomeExpenseChart) {
                incomeExpenseChart.data.datasets[0].data = [income, expenses];
                incomeExpenseChart.update();
            } else {
                incomeExpenseChart = new Chart(document.getElementById('incomeExpenseChart'), {
                    type: 'doughnut',
                    data: {
                        labels: ['Income', 'Expenses'],
                        datasets: [{
                            data: [income, expenses],
                            backgroundColor: ['#16a34a', '#d1d5db'],
                            borderWidth: 0
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        cutout: '72%',
                        plugins: {
                            legend: {
                                position: 'bottom',
                                labels: { color: '#6b7280', padding: 16, font: { size: 12 } }
                            }
                        }
                    }
                });
            }

            const cats = {};
            transactions.filter(t => t.type === 'expense').forEach(t => {
                cats[t.category] = (cats[t.category] || 0) + t.amount;
            });
            const labels = Object.keys(cats).map(c => c.charAt(0).toUpperCase() + c.slice(1));
            const data = Object.values(cats);
            const colors = ['#0060a9', '#1a73c7', '#4a9ae5', '#6bb5f0', '#94cdf7', '#b8e0fb', '#d1ebfd'];

            if (categoryChart) {
                categoryChart.data.labels = labels;
                categoryChart.data.datasets[0].data = data;
                categoryChart.update();
            } else if (labels.length > 0) {
                categoryChart = new Chart(document.getElementById('categoryChart'), {
                    type: 'bar',
                    data: {
                        labels,
                        datasets: [{
                            data,
                            backgroundColor: colors.slice(0, labels.length),
                            borderRadius: 6
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            y: {
                                beginAtZero: true,
                                grid: { color: '#f3f4f6' },
                                ticks: { color: '#9ca3af', font: { size: 11 } }
                            },
                            x: {
                                grid: { display: false },
                                ticks: { color: '#9ca3af', font: { size: 11 } }
                            }
                        }
                    }
                });
            }
        }

        loadData();
    </script>

    <!-- Change Password Modal -->
    <div class="modal-overlay" id="change-pw-modal">
        <div class="modal">
            <h3>Change Password</h3>
            <div class="form-group"><label>Current Password</label><input type="password" id="pw-current" placeholder="Current password"></div>
            <div class="form-group"><label>New Password</label><input type="password" id="pw-new" placeholder="New password"></div>
            <div class="form-group"><label>Confirm New Password</label><input type="password" id="pw-confirm" placeholder="Confirm new password"></div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeChangePwModal()">Cancel</button>
                <button class="btn btn-primary" onclick="submitChangePw()">Save</button>
            </div>
        </div>
    </div>

    <!-- Change Username Modal -->
    <div class="modal-overlay" id="change-un-modal">
        <div class="modal">
            <h3>Change Username</h3>
            <div class="form-group"><label>New Username</label><input type="text" id="un-new" placeholder="New username"></div>
            <div class="form-group"><label>Password (to confirm)</label><input type="password" id="un-password" placeholder="Enter password"></div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeChangeUnModal()">Cancel</button>
                <button class="btn btn-primary" onclick="submitChangeUn()">Save</button>
            </div>
        </div>
    </div>
</body>
</html>
