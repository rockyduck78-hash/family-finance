<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Family Finance</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="app-layout">
        <nav class="topnav">
            <a href="/dashboard" class="topnav-brand">
                <div class="brand-icon">$</div>
                <span class="brand-text">Family Finance</span>
            </a>
            <div class="topnav-nav">
                <a href="/dashboard" class="active"><span class="nav-icon">&#9632;</span> <span class="nav-label">Dashboard</span></a>
                <a href="/transactions"><span class="nav-icon">&#9655;</span> <span class="nav-label">Transactions</span></a>
                <a href="/kids"><span class="nav-icon">&#9679;</span> <span class="nav-label">Kids</span></a>
                <a href="/transfer"><span class="nav-icon">&#8644;</span> <span class="nav-label">Transfer</span></a>
            </div>
            <div class="topnav-right">
                <div class="topnav-user">
                    <div class="topnav-avatar" id="user-avatar"></div>
                    <span class="topnav-username" id="user-display"></span>
                </div>
                <button class="topnav-signout" onclick="logout()">Sign Out</button>
            </div>
        </nav>

        <main class="main-content">
            <div class="page-header">
                <h1>Dashboard</h1>
                <p>Your financial overview at a glance</p>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Total Income</div>
                    <div class="stat-value income" id="total-income">$0.00</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Total Expenses</div>
                    <div class="stat-value expense" id="total-expenses">$0.00</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Current Balance</div>
                    <div class="stat-value balance" id="current-balance">$0.00</div>
                </div>
            </div>

            <div class="charts-grid">
                <div class="chart-card">
                    <h3>Income vs Expenses</h3>
                    <div class="chart-container"><canvas id="incomeExpenseChart"></canvas></div>
                </div>
                <div class="chart-card">
                    <h3>Spending by Category</h3>
                    <div class="chart-container"><canvas id="categoryChart"></canvas></div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const user = localStorage.getItem('currentUser');
        if (!user) window.location.href = '/';
        document.getElementById('user-display').textContent = user;
        document.getElementById('user-avatar').textContent = user[0].toUpperCase();

        let transactions = [];
        let incomeExpenseChart = null;
        let categoryChart = null;

        async function loadData() {
            const res = await fetch('/api/user/' + user);
            const data = await res.json();
            transactions = data.transactions || [];
            updateSummary();
            updateCharts();
        }

        function formatCurrency(amount) {
            return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(amount);
        }

        function updateSummary() {
            const income = transactions.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
            const expenses = transactions.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
            document.getElementById('total-income').textContent = formatCurrency(income);
            document.getElementById('total-expenses').textContent = formatCurrency(expenses);
            document.getElementById('current-balance').textContent = formatCurrency(income - expenses);
        }

        function updateCharts() {
            const income = transactions.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
            const expenses = transactions.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);

            if (incomeExpenseChart) {
                incomeExpenseChart.data.datasets[0].data = [income, expenses];
                incomeExpenseChart.update();
            } else {
                incomeExpenseChart = new Chart(document.getElementById('incomeExpenseChart'), {
                    type: 'doughnut',
                    data: {
                        labels: ['Income', 'Expenses'],
                        datasets: [{
                            data: [income, expenses],
                            backgroundColor: ['#16a34a', '#d1d5db'],
                            borderWidth: 0
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        cutout: '72%',
                        plugins: {
                            legend: {
                                position: 'bottom',
                                labels: { color: '#6b7280', padding: 16, font: { size: 12 } }
                            }
                        }
                    }
                });
            }

            const cats = {};
            transactions.filter(t => t.type === 'expense').forEach(t => {
                cats[t.category] = (cats[t.category] || 0) + t.amount;
            });
            const labels = Object.keys(cats).map(c => c.charAt(0).toUpperCase() + c.slice(1));
            const data = Object.values(cats);
            const colors = ['#0060a9', '#1a73c7', '#4a9ae5', '#6bb5f0', '#94cdf7', '#b8e0fb', '#d1ebfd'];

            if (categoryChart) {
                categoryChart.data.labels = labels;
                categoryChart.data.datasets[0].data = data;
                categoryChart.update();
            } else if (labels.length > 0) {
                categoryChart = new Chart(document.getElementById('categoryChart'), {
                    type: 'bar',
                    data: {
                        labels,
                        datasets: [{
                            data,
                            backgroundColor: colors.slice(0, labels.length),
                            borderRadius: 6
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            y: {
                                beginAtZero: true,
                                grid: { color: '#f3f4f6' },
                                ticks: { color: '#9ca3af', font: { size: 11 } }
                            },
                            x: {
                                grid: { display: false },
                                ticks: { color: '#9ca3af', font: { size: 11 } }
                            }
                        }
                    }
                });
            }
        }

        async function navigateTo(page) {
            const pw = prompt('Enter your password to continue:');
            if (pw === null) return;
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pw })
                });
                const data = await res.json();
                if (data.success) {
                    window.location.href = page;
                } else {
                    alert(data.error || 'Incorrect password');
                }
            } catch (e) {
                alert('Failed to verify password');
            }
        }

        function logout() {
            localStorage.removeItem('currentUser');
            sessionStorage.clear();
            window.location.href = '/';
        }

        loadData();
    </script>
</body>
</html>
